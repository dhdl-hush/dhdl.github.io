<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 상단 헤더 */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(10, 10, 10, 0.9);
        }

        h1 {
            color: #b30000;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 0;
        }

        /* 메인 컨텐츠 영역 */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #222;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* 상태 바 (생명력, 이성치) */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-box {
            border: 1px solid #444;
            padding: 15px;
            text-align: center;
        }

        .status-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
            display: block;
        }

        .status-value {
            font-size: 2rem;
            color: #fff;
            font-weight: bold;
        }

        /* 주사위 섹션 추가 스타일 */
        .dice-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px double #333;
            text-align: center;
            background: rgba(20, 20, 20, 0.5);
        }

        .dice-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .die {
            width: 60px;
            height: 60px;
            background: #1a1a1a;
            border: 2px solid #b30000;
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(179, 0, 0, 0.3);
        }

        #dice-result-text {
            font-size: 1.1rem;
            min-height: 1.5rem;
            margin-bottom: 15px;
            color: #aaa;
        }

        .roll-btn {
            background: transparent;
            color: #b30000;
            border: 1px solid #b30000;
            padding: 12px 40px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 3px;
            transition: all 0.3s;
        }

        .roll-btn:hover {
            background: #b30000;
            color: #fff;
            box-shadow: 0 0 15px #b30000;
        }

        /* 결과 강조 효과 */
        .fumble { color: #ff0000; animation: shake 0.2s infinite; text-shadow: 0 0 10px red; font-weight: bold; }
        .special { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }
        .normal { color: #fff; font-weight: bold; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-2px, 1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* 비밀(Secret) 영역 */
        .secret-section {
            margin-top: 40px;
            border: 1px solid #b30000;
            padding: 20px;
            background: rgba(179, 0, 0, 0.05);
            position: relative;
        }

        .secret-title {
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .secret-content {
            font-size: 0.95rem;
            line-height: 1.6;
            filter: blur(5px);
            transition: filter 0.5s;
            user-select: none;
        }

        .secret-section:hover .secret-content {
            filter: blur(0);
        }

        /* 하단 버튼 */
        .footer-nav {
            margin-top: auto;
            padding: 40px;
        }

        .back-btn {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #b30000;
        }

        /* 노이즈 효과 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <header>
        <h1>PC1: [캐릭터 이름]</h1>
    </header>

    <div class="container">
        <!-- 1. 상태 정보 -->
        <div class="status-grid">
            <div class="status-box">
                <span class="status-label">생명력</span>
                <span class="status-value">6 / 6</span>
            </div>
            <div class="status-box">
                <span class="status-label">이성치</span>
                <span class="status-value">6 / 6</span>
            </div>
        </div>

        <!-- 2. 주사위 판정 영역 (추가된 부분) -->
        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result-text">행동 판정이 필요할 때 주사위를 굴리세요.</div>
            <button class="roll-btn" onclick="rollDice()">ROLL DICE</button>
        </div>

        <!-- 3. 사명 -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: #888; font-size: 0.9rem; border-left: 3px solid #b30000; padding-left: 10px;">공개된 사명</h3>
            <p>당신의 사명은 이 저택에서 무사히 살아나가는 것입니다.</p>
        </div>

        <!-- 4. 비밀 -->
        <div class="secret-section">
            <div class="secret-title">
                ⚠️ [비밀: 쇼크 - 정신 오염]
            </div>
            <div class="secret-content">
                사실 당신은 이 저택의 주인을 죽인 범인입니다. <br>
                당신의 진짜 사명은 자신의 정체가 들키지 않은 채 다른 사람들을 모두 희생시키는 것입니다.
            </div>
            <div style="font-size: 0.7rem; color: #444; margin-top: 10px;">
                * 마우스를 올리면 내용이 보입니다.
            </div>
        </div>
    </div>

    <!-- 파이어베이스 연결용 스크립트 -->
   <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 이 부분을 본인의 콘솔 값으로 정확히 채우세요!
const firebaseConfig = {
  apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
  authDomain: "dhdl-48b4a.firebaseapp.com",
  projectId: "dhdl-48b4a",
  storageBucket: "dhdl-48b4a.firebasestorage.app",
  messagingSenderId: "970954764585",
  appId: "1:970954764585:web:7388d241cc77ec70dd8738",
  measurementId: "G-DV6XRPBJV4"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const btn = document.getElementById('roll-btn');
        
        btn.addEventListener('click', () => {
            btn.disabled = true;
            let count = 0;
            
            const timer = setInterval(() => {
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                document.getElementById('die1').innerText = d1;
                document.getElementById('die2').innerText = d2;
                count++;

                if(count > 10) {
                    clearInterval(timer);
                    const final1 = Math.floor(Math.random() * 6) + 1;
                    const final2 = Math.floor(Math.random() * 6) + 1;
                    const total = final1 + final2;
                    
                    document.getElementById('die1').innerText = final1;
                    document.getElementById('die2').innerText = final2;
                    document.getElementById('dice-result').innerText = "결과: " + total;

                    // 파이어베이스로 데이터 전송
                    update(ref(db, 'room_01/pc1'), {
                        name: "플레이어1",
                        lastDice: total,
                        hp: 6,
                        san: 6
                    }).then(() => {
                        console.log("GM에게 전송 완료!");
                    }).catch(e => console.error("전송 에러:", e));

                    btn.disabled = false;
                }
            }, 50);
        });
    </script>

</body>
</html>

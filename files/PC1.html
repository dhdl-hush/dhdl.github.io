<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #d1d1d1; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 20px; text-align: center; border-bottom: 1px solid #333; background: rgba(10, 10, 10, 0.9); }
        h1 { color: #b30000; font-size: 1.5rem; letter-spacing: 5px; }
        .container { width: 90%; max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #222; background: #0a0a0a; }
        
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .status-box { border: 1px solid #444; padding: 10px; text-align: center; }
        .status-value { font-size: 1.5rem; color: #fff; font-weight: bold; }

        .dice-section { margin: 20px 0; padding: 20px; border: 1px double #b30000; text-align: center; }
        .dice-display { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .die { width: 50px; height: 50px; background: #1a1a1a; border: 2px solid #b30000; color: #fff; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
        
        .roll-btn { background: #b30000; color: #fff; border: none; padding: 10px 30px; cursor: pointer; width: 100%; font-size: 1rem; }
        .roll-btn:disabled { background: #444; }

        .secret-box { margin-top: 20px; border: 1px solid #b30000; padding: 15px; background: rgba(179,0,0,0.1); cursor: help; }
        .secret-content { filter: blur(5px); transition: 0.3s; }
        .secret-box:hover .secret-content { filter: blur(0); }

        .fumble { color: #ff0000 !important; font-weight: bold; animation: shake 0.2s infinite; display: inline-block; }
        .special { color: #00ffcc !important; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, -1px); }
        }

/* 인세인 표준 핸드아웃 스타일 */
.insane-card {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    font-family: 'Malgun Gothic', serif;
    border: 2px solid #000;
    background: #fff;
    color: #000;
    box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
}

.card-header {
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
    border-bottom: 2px solid #000;
    padding: 10px;
    letter-spacing: 2px;
}

.card-info-table {
    display: grid;
    grid-template-columns: 60px 1fr;
    border-bottom: 2px solid #000;
}

.info-label {
    border-right: 2px solid #000;
    padding: 5px;
    font-weight: bold;
    text-align: center;
    background: #f0f0f0;
}

.info-value { padding: 5px 10px; }

.card-body-title {
    text-align: center;
    font-weight: bold;
    border-bottom: 1px solid #000;
    padding: 5px;
    background: #f9f9f9;
}

.card-content {
    min-height: 200px;
    padding: 15px;
    line-height: 1.8;
    text-align: left;
    white-space: pre-wrap;
    background-image: repeating-linear-gradient(transparent, transparent 27px, #ddd 27px, #ddd 28px);
}

/* 뒷면 (비밀) 스타일 */
.insane-card.secret {
    background: #000;
    color: #fff;
    border-color: #fff;
}

.insane-card.secret .card-header { background: #000; color: #fff; border-bottom: 2px solid #fff; }
.insane-card.secret .info-label { background: #222; color: #fff; border-right: 2px solid #fff; }
.insane-card.secret .card-body-title { background: #000; color: #fff; border-bottom: 1px solid #fff; }
.insane-card.secret .card-content { background-image: repeating-linear-gradient(transparent, transparent 27px, #444 27px, #444 28px); }

.secret-footer {
    background: #000;
    color: #fff;
    padding: 10px;
    text-align: center;
    font-size: 0.8rem;
    border-top: 2px solid #fff;
}
    </style>
</head>
<body>

    <header><h1>PC1 SHEET</h1></header>

    <div class="container">
        <!-- 상태 수치 -->
        <div class="status-grid">
            <div class="status-box"><div>생명력</div><div class="status-value">6/6</div></div>
            <div class="status-box"><div>이성치</div><div class="status-value">6/6</div></div>
        </div>

        <!-- 주사위 판정 -->
        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result" style="margin-bottom:10px;">주사위를 굴려주세요.</div>
            <button id="roll-btn" class="roll-btn">ROLL DICE</button>
        </div>

        <!-- 사명 -->
        <div style="margin-bottom: 30px; border-left: 3px solid #b30000; padding-left: 15px;">
            <h3 style="color: #888; font-size: 0.9rem;">공개된 사명</h3>
            <p>당신의 사명은 이 저택에서 무사히 살아나가는 것입니다.</p>
        </div>

        <!-- 비밀 -->
        <div class="secret-box">
            <strong>[비밀]</strong>
            <div class="secret-content">여기에 캐릭터의 비밀 내용을 입력하세요.</div>
        </div>
    </div>

    <!-- 인벤토리 -->
    <div class="container" style="margin-top: 20px;">
        <h3 style="color: #b30000; border-bottom: 1px solid #333;">인벤토리 (핸드아웃)</h3>
        <div id="inventory-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
            <p style="color: #666; font-size: 0.9rem;">획득한 아이템이 없습니다.</p>
        </div>
    </div>

    <!-- 핸드아웃 팝업 모달 -->
<!-- 실시간 획득 알림 팝업 (최종 수정 버전) -->
<div id="handout-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:10000; width:90%; max-width:420px;">
    
    <!-- 앞면 (공개 정보) -->
    <div id="card-front" class="insane-card">
        <div class="card-header">Handout</div>
        <div class="card-info-table">
            <div class="info-label">이름</div>
            <div class="info-value" id="modal-title"></div>
        </div>
        <div class="card-body-title">사 명</div>
        <div class="card-content" id="modal-content"></div>
        <div style="padding:10px;">
            <button onclick="revealSecretInModal()" style="width:100%; padding:10px; background:#000; color:#fff; border:none; cursor:pointer; font-weight:bold;">비밀 확인</button>
        </div>
    </div>

    <!-- 뒷면 (비밀 정보 - 처음엔 숨김) -->
    <div id="card-back" class="insane-card secret" style="display:none;">
        <div class="card-header" style="color:#fff;">Handout</div>
        <div class="card-info-table" style="border-bottom: 2px solid #fff;">
            <div class="info-label" style="border-right: 2px solid #fff;">비밀</div>
            <div class="info-value"></div>
        </div>
        <div class="card-info-table" style="border-bottom: 1px solid #fff;">
            <div class="info-label" style="border-right: 1px solid #fff;">쇼크</div>
            <div class="info-value" id="modal-shock"></div>
        </div>
        <div class="card-content" id="modal-secret-text"></div>
        <div class="secret-footer">이 비밀을 스스로 밝힐 수는 없다.</div>
    </div>

    <button onclick="closeHandout()" style="width:100%; margin-top:10px; padding:10px; background:#333; color:#fff; border:none; cursor:pointer;">창 닫기</button>
</div>

    <!-- 파이어베이스 로직 (통합 버전) -->
    <script type="module">
        // 1. 도구들을 하나로 합쳐서 가져오기
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 본인의 콘솔 값으로 채우세요!
        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 기능 1: 주사위 굴리기 ---
        const btn = document.getElementById('roll-btn');
        btn.addEventListener('click', () => {
            btn.disabled = true;
            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('die1').innerText = Math.floor(Math.random() * 6) + 1;
                document.getElementById('die2').innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if(count > 10) {
                    clearInterval(timer);
                    const f1 = Math.floor(Math.random() * 6) + 1;
                    const f2 = Math.floor(Math.random() * 6) + 1;
                    const total = f1 + f2;
                    document.getElementById('die1').innerText = f1;
                    document.getElementById('die2').innerText = f2;
                    
                    const resBox = document.getElementById('dice-result');
                    if (total === 2) resBox.innerHTML = `결과: ${total} - <span class="fumble">펌블!</span>`;
                    else if (total === 12) resBox.innerHTML = `결과: ${total} - <span class="special">스페셜!</span>`;
                    else resBox.innerHTML = `결과: ${total} - <span>판정 완료</span>`;

                    update(ref(db, 'room_01/pc1'), { lastDice: total, name: "플레이어1", hp: 6, san: 6 });
                    btn.disabled = false;
                }
            }, 50);
        });

        // --- 기능 2: 핸드아웃 수신 및 인벤토리 ---
        const invRef = ref(db, 'room_01/pc1/inventory');
        let isInitialLoad = true;

        // 첫 로딩인지 체크
        onValue(invRef, () => { isInitialLoad = false; }, { onlyOnce: true });

        // 새 아이템(핸드아웃)이 추가될 때마다 실행
      let currentSecret = ""; // 현재 열린 팝업의 비밀 임시 저장

        onChildAdded(invRef, (snapshot) => {
    const item = snapshot.val();
    const list = document.getElementById('inventory-list');
    if(list.querySelector('p')) list.innerHTML = "";

    // 쇼크와 대상을 합쳐서 하나의 문자열로 만듭니다 (예: "전원 / 1D6")
    const shockInfo = `${item.trigger || '전원'} / ${item.shock || '없음'}`;

    const itemDiv = document.createElement('div');
    itemDiv.style = "background:#111; border:1px solid #333; padding:10px; cursor:pointer; margin-bottom:5px; transition:0.3s;";
    itemDiv.innerHTML = `<strong>${item.title}</strong> <small style="color:#555; float:right;">보기</small>`;
    
    // 이 부분에서 shockInfo를 추가로 전달합니다.
    itemDiv.onclick = () => window.showHandout(item.title, item.content, item.secret, shockInfo);
    list.appendChild(itemDiv);

    if (!isInitialLoad) {
        window.showHandout(item.title, item.content, item.secret, shockInfo);
    }
});

window.showHandout = function(title, content, secret, shock) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-content').innerText = content;
    document.getElementById('modal-secret-text').innerText = secret;
    document.getElementById('modal-shock').innerText = shock || "없음";
    
    // 초기 상태: 앞면만 보이기
    document.getElementById('card-front').style.display = "block";
    document.getElementById('card-back').style.display = "none";
    document.getElementById('handout-modal').style.display = "block";
}

window.revealSecretInModal = function() {
    if(confirm("이 비밀을 확인하시겠습니까? 쇼크 판정이 발생할 수 있습니다.")) {
        document.getElementById('card-front').style.display = "none";
        document.getElementById('card-back').style.display = "block";
    }
}
        // 창을 닫는 함수를 전역(window)에 등록
window.closeHandout = function() {
    const modal = document.getElementById('handout-modal');
    if (modal) {
        modal.style.display = "none";
    }
};
    </script>
</body>
</html>

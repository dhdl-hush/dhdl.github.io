<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #d1d1d1; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 20px; text-align: center; border-bottom: 1px solid #333; background: rgba(10, 10, 10, 0.9); }
        h1 { color: #b30000; font-size: 1.5rem; letter-spacing: 5px; margin: 0; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; padding: 20px; border: 1px solid #222; background: #0a0a0a; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .status-box { border: 1px solid #444; padding: 15px; text-align: center; }
        .status-label { font-size: 0.8rem; color: #888; margin-bottom: 10px; display: block; }
        .status-value { font-size: 2rem; color: #fff; font-weight: bold; }
        .dice-section { margin: 30px 0; padding: 20px; border: 1px double #333; text-align: center; background: rgba(20, 20, 20, 0.5); }
        .dice-display { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .die { width: 60px; height: 60px; background: #1a1a1a; border: 2px solid #b30000; color: #fff; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-shadow: 0 0 10px rgba(179, 0, 0, 0.3); }
        #dice-result-text { font-size: 1.1rem; min-height: 1.5rem; margin-bottom: 15px; color: #aaa; }
        .roll-btn { background: transparent; color: #b30000; border: 1px solid #b30000; padding: 12px 40px; cursor: pointer; font-size: 1rem; letter-spacing: 3px; transition: all 0.3s; width: 100%; }
        .roll-btn:hover { background: #b30000; color: #fff; box-shadow: 0 0 15px #b30000; }
        .roll-btn:disabled { color: #444; border-color: #444; cursor: not-allowed; }
        .fumble { color: #ff0000; font-weight: bold; }
        .special { color: #00ffcc; font-weight: bold; }
        .secret-section { margin-top: 40px; border: 1px solid #b30000; padding: 20px; background: rgba(179, 0, 0, 0.05); }
        .secret-content { filter: blur(5px); transition: filter 0.5s; }
        .secret-section:hover .secret-content { filter: blur(0); }
    </style>
</head>
<body>

    <header><h1>PC1: [캐릭터 이름]</h1></header>

    <div class="container">
        <div class="status-grid">
            <div class="status-box"><span class="status-label">생명력</span><span class="status-value">6 / 6</span></div>
            <div class="status-box"><span class="status-label">이성치</span><span class="status-value">6 / 6</span></div>
        </div>

        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <!-- ID를 dice-result-text로 확실히 고정 -->
            <div id="dice-result-text">행동 판정이 필요할 때 주사위를 굴리세요.</div>
            <!-- ID 추가 및 onclick 제거 -->
            <button class="roll-btn" id="roll-btn">ROLL DICE</button>
        </div>

        <div class="secret-section">
            <div style="color: #ff4d4d; font-weight: bold;">⚠️ [비밀: 쇼크 - 정신 오염]</div>
            <div class="secret-content">당신의 진짜 사명은 자신의 정체가 들키지 않은 채 다른 사람들을 모두 희생시키는 것입니다.</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 본인의 Config를 여기에 정확히 넣으세요
const firebaseConfig = {
  apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
  authDomain: "dhdl-48b4a.firebaseapp.com",
  projectId: "dhdl-48b4a",
  storageBucket: "dhdl-48b4a.firebasestorage.app",
  messagingSenderId: "970954764585",
  appId: "1:970954764585:web:7388d241cc77ec70dd8738",
  measurementId: "G-DV6XRPBJV4"
};
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const btn = document.getElementById('roll-btn');
        const resText = document.getElementById('dice-result-text');
        
        btn.addEventListener('click', () => {
            btn.disabled = true;
            resText.innerText = "굴리는 중...";
            let count = 0;
            
            const timer = setInterval(() => {
                document.getElementById('die1').innerText = Math.floor(Math.random() * 6) + 1;
                document.getElementById('die2').innerText = Math.floor(Math.random() * 6) + 1;
                count++;

                if(count > 12) {
                    clearInterval(timer);
                    const final1 = Math.floor(Math.random() * 6) + 1;
                    const final2 = Math.floor(Math.random() * 6) + 1;
                    const total = final1 + final2;
                    
                    document.getElementById('die1').innerText = final1;
                    document.getElementById('die2').innerText = final2;

                    // 결과 텍스트 처리
                    if(total === 2) resText.innerHTML = `결과: ${total} - <span class="fumble">펌블!</span>`;
                    else if(total === 12) resText.innerHTML = `결과: ${total} - <span class="special">스페셜!</span>`;
                    else resText.innerText = `결과: ${total} - 판정 완료`;

                    // 서버 전송 (경로 확인: room_01/pc1)
                    update(ref(db, 'room_01/pc1'), {
                        name: "플레이어1",
                        lastDice: total,
                        hp: 6,
                        san: 6,
                        time: Date.now()
                    }).then(() => {
                        console.log("데이터 전송 성공!");
                    }).catch(e => console.error("전송 에러:", e));

                    btn.disabled = false;
                }
            }, 50);
        });
    </script>
</body>
</html>

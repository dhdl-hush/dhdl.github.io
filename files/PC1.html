<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #d1d1d1; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 20px; text-align: center; border-bottom: 1px solid #333; background: rgba(10, 10, 10, 0.9); }
        h1 { color: #b30000; font-size: 1.5rem; letter-spacing: 5px; margin: 0; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; padding: 20px; border: 1px solid #222; background: #0a0a0a; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); }
        
        /* 상태 바 */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .status-box { border: 1px solid #444; padding: 15px; text-align: center; }
        .status-label { font-size: 0.8rem; color: #888; margin-bottom: 10px; display: block; }
        .status-value { font-size: 2rem; color: #fff; font-weight: bold; }

        /* 주사위 섹션 */
        .dice-section { margin: 30px 0; padding: 20px; border: 1px double #333; text-align: center; background: rgba(20, 20, 20, 0.5); }
        .dice-display { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .die { width: 60px; height: 60px; background: #1a1a1a; border: 2px solid #b30000; color: #fff; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        #dice-result-text { font-size: 1.1rem; min-height: 1.5rem; margin-bottom: 15px; color: #aaa; }
        .roll-btn { background: transparent; color: #b30000; border: 1px solid #b30000; padding: 12px 40px; cursor: pointer; font-size: 1rem; letter-spacing: 3px; transition: 0.3s; }
        .roll-btn:hover { background: #b30000; color: #fff; }
        .roll-btn:disabled { color: #444; border-color: #444; cursor: not-allowed; }

        /* 결과 애니메이션 */
        .fumble { color: #ff0000; animation: shake 0.2s infinite; font-weight: bold; }
        .special { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* 비밀 영역 */
        .secret-section { margin-top: 40px; border: 1px solid #b30000; padding: 20px; background: rgba(179, 0, 0, 0.05); }
        .secret-content { font-size: 0.95rem; line-height: 1.6; filter: blur(5px); transition: filter 0.5s; user-select: none; }
        .secret-section:hover .secret-content { filter: blur(0); }

        .back-btn { color: #555; text-decoration: none; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>

    <header><h1>PC1: [캐릭터 이름]</h1></header>

    <div class="container">
        <div class="status-grid">
            <div class="status-box">
                <span class="status-label">생명력</span>
                <span class="status-value" id="hp-val">6 / 6</span>
            </div>
            <div class="status-box">
                <span class="status-label">이성치</span>
                <span class="status-value" id="san-val">6 / 6</span>
            </div>
        </div>

        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result-text">판정이 필요할 때 주사위를 굴리세요.</div>
            <button class="roll-btn" id="roll-btn">ROLL DICE</button>
        </div>

        <div class="secret-section">
            <div style="color: #ff4d4d; font-weight: bold; margin-bottom: 10px;">⚠️ [비밀: 쇼크 - 정신 오염]</div>
            <div class="secret-content">
                당신은 사실 이 저택의 주인을 죽인 범인입니다. <br>
                당신의 진짜 사명은 정체를 들키지 않고 모두를 희생시키는 것입니다.
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" class="back-btn">메인으로 돌아가기</a>
        </div>
    </div>

    <!-- 파이어베이스 연결 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 본인의 Config로 교체 필수!
        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // GM에게 데이터 업데이트 함수
        function sendToGM(diceValue) {
            update(ref(db, 'room_01/pc1'), {
                name: "캐릭터A", // 여기 본인 캐릭터 이름
                hp: 6,
                san: 6,
                lastDice: diceValue,
                lastUpdate: Date.now()
            });
        }

        // 주사위 굴리기 기능 (스크립트 내부에 통합)
        window.rollDice = function() {
            const btn = document.getElementById('roll-btn');
            const resText = document.getElementById('dice-result-text');
            const d1El = document.getElementById('die1');
            const d2El = document.getElementById('die2');

            btn.disabled = true;
            resText.innerText = "운명 결정 중...";
            resText.className = "";

            let count = 0;
            const interval = setInterval(() => {
                d1El.innerText = Math.floor(Math.random() * 6) + 1;
                d2El.innerText = Math.floor(Math.random() * 6) + 1;
                count++;

                if (count > 10) {
                    clearInterval(interval);
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    const total = d1 + d2;
                    d1El.innerText = d1;
                    d2El.innerText = d2;

                    if (total === 2) {
                        resText.innerHTML = `결과: ${total} - <span class="fumble">펌블 (Fumble)</span>`;
                    } else if (total === 12) {
                        resText.innerHTML = `결과: ${total} - <span class="special">스페셜 (Special)</span>`;
                    } else {
                        resText.innerHTML = `결과: ${total} - <span>성공 여부를 확인하세요.</span>`;
                    }

                    // 서버로 결과 전송
                    sendToGM(total);
                    btn.disabled = false;
                }
            }, 50);
        };

        document.getElementById('roll-btn').addEventListener('click', rollDice);

    </script>
</body>
</html>

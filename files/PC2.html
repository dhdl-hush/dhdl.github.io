<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        /* --- 기본 배경 및 노이즈 효과 --- */
        body { margin: 0; padding: 0; background-color: #050505; color: #d1d1d1; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); opacity: 0.05; pointer-events: none; z-index: 9999; }
        
        /* --- 상단 헤더 --- */
        header { width: 100%; padding: 20px; text-align: center; border-bottom: 1px solid #333; background: rgba(10, 10, 10, 0.9); }
        h1 { color: #b30000; font-size: 1.2rem; letter-spacing: 8px; margin: 0; text-shadow: 0 0 10px rgba(179,0,0,0.5); }

        /* --- 메인 컨테이너 --- */
        .container { width: 90%; max-width: 700px; margin: 20px auto; padding: 20px; background: rgba(10, 10, 10, 0.8); border: 1px solid #222; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }

        /* --- 캐릭터 시트 (상단부) --- */
        .character-sheet { display: grid; grid-template-columns: 100px 1fr; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #222; }
        .profile-img { width: 100px; height: 130px; background: #000; border: 1px solid #333; display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.7rem; border-radius: 2px; }
        .char-info { display: flex; flex-direction: column; gap: 8px; }
        .info-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; }
        .info-label { color: #666; font-size: 0.75rem; width: 50px; letter-spacing: 1px; }
        .info-input { background: transparent; border: none; color: #fff; font-size: 0.9rem; width: 100%; outline: none; }
        
        /* 스탯(HP/SAN) 디자인 - 눈에 띄지 않게 녹아들게 */
        .stat-display { display: flex; align-items: baseline; gap: 5px; }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: #b30000; text-shadow: 0 0 5px rgba(179,0,0,0.3); }
        .stat-max { font-size: 0.8rem; color: #444; }

        /* --- 주사위 섹션 (초기 디자인 복구) --- */
        .dice-section { margin: 30px 0; padding: 20px; border: 1px double #333; text-align: center; background: rgba(15, 15, 15, 0.5); }
        .dice-display { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .die { width: 55px; height: 55px; background: #000; border: 1px solid #b30000; color: #fff; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(179,0,0,0.2); }
        #dice-result { font-size: 1rem; color: #888; margin-bottom: 15px; height: 1.2rem; }
        .roll-btn { background: transparent; color: #b30000; border: 1px solid #b30000; padding: 10px 40px; cursor: pointer; font-size: 0.9rem; letter-spacing: 4px; transition: 0.3s; }
        .roll-btn:hover { background: #b30000; color: #fff; box-shadow: 0 0 15px rgba(179,0,0,0.5); }
        .fumble { color: #ff0000; animation: shake 0.2s infinite; font-weight: bold; }
        .special { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, -1px); } }

        /* --- 사명 & 비밀 (초기 디자인 복구) --- */
        .mission-box { margin-bottom: 25px; border-left: 3px solid #b30000; padding-left: 15px; }
        .mission-box h3 { color: #888; font-size: 0.8rem; margin: 0 0 8px 0; letter-spacing: 2px; }
        .mission-box p { font-size: 0.95rem; line-height: 1.6; margin: 0; color: #bbb; }

        .secret-section { margin-top: 30px; border: 1px solid #b30000; padding: 20px; background: rgba(179, 0, 0, 0.03); position: relative; }
        .secret-title { color: #ff4d4d; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .secret-content { font-size: 0.9rem; line-height: 1.7; filter: blur(6px); transition: filter 0.6s ease; user-select: none; color: #ccc; }
        .secret-section:hover .secret-content { filter: blur(0); }

        /* --- 인벤토리 리스트 --- */
        .inventory-section { margin-top: 40px; }
        .inventory-title { font-size: 0.8rem; color: #444; letter-spacing: 2px; border-bottom: 1px solid #222; padding-bottom: 5px; margin-bottom: 15px; }
        #inventory-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-slot { background: #0a0a0a; border: 1px solid #222; padding: 12px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; text-align: center; }
        .item-slot:hover { border-color: #b30000; color: #fff; background: #150000; }

        /* --- 핸드아웃 모달 (이미지 디자인 적용) --- */
        /* ...기존에 드린 insane-card 관련 CSS는 그대로 유지하거나 생략 (길이 조절용)... */
        .insane-card { width: 100%; max-width: 400px; margin: 0 auto; font-family: 'Malgun Gothic', serif; border: 2px solid #000; background: #fff; color: #000; }
        .card-header { text-align: center; font-size: 1.3rem; font-weight: bold; border-bottom: 2px solid #000; padding: 8px; }
        .card-info-table { display: grid; grid-template-columns: 60px 1fr; border-bottom: 2px solid #000; }
        .info-label-card { border-right: 2px solid #000; padding: 5px; font-weight: bold; text-align: center; background: #f0f0f0; font-size: 0.8rem; }
        .card-content { min-height: 180px; padding: 15px; line-height: 1.7; text-align: left; white-space: pre-wrap; background-image: repeating-linear-gradient(transparent, transparent 27px, #eee 27px, #eee 28px); font-size: 0.9rem; }
        .insane-card.secret-card { background: #000; color: #fff; border-color: #fff; }
        .insane-card.secret-card .card-content { background-image: repeating-linear-gradient(transparent, transparent 27px, #333 27px, #333 28px); }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <header>
        <h1>INSANE : CHARACTER SHEET</h1>
    </header>

    <div class="container">
        <!-- 1. 캐릭터 시트 (수치 조절 버튼 제거, 디자인 통합) -->
        <div class="character-sheet">
            <div class="profile-img">No Image</div>
            <div class="char-info">
                <div class="info-row">
                    <span class="info-label">NAME</span>
                    <input type="text" id="char-name" class="info-input" placeholder="이름을 입력하세요" onchange="syncProfile()">
                </div>
                <div style="display: flex; gap: 30px; margin: 5px 0;">
                    <div class="stat-display">
                        <span class="info-label">HP</span>
                        <span id="hp-val" class="stat-num">6</span>
                        <span class="stat-max">/ 6</span>
                    </div>
                    <div class="stat-display">
                        <span class="info-label">SAN</span>
                        <span id="san-val" class="stat-num">6</span>
                        <span class="stat-max">/ 6</span>
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">NOTE</span>
                    <input type="text" id="char-note" class="info-input" placeholder="특기 또는 상태 이상" onchange="syncProfile()">
                </div>
            </div>
        </div>

        <!-- 2. 주사위 판정 (초기 디자인) -->
        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result"></div>
            <button class="roll-btn" id="roll-btn">ROLL DICE</button>
        </div>

        <!-- 3. 사명 & 비밀 (초기 디자인) -->
        <div class="mission-box">
            <h3>공개 사명</h3>
            <p>당신의 사명은 이 저택에서 무사히 살아나가는 것입니다.</p>
        </div>

        <div class="secret-section">
            <div class="secret-title">⚠️ [비밀: 쇼크 - 정신 오염]</div>
            <div class="secret-content">
                사실 당신은 이 저택의 주인을 죽인 범인입니다. <br>
                당신의 진짜 사명은 자신의 정체가 들키지 않은 채 다른 사람들을 모두 희생시키는 것입니다.
            </div>
        </div>

        <!-- 4. 인벤토리 -->
        <div class="inventory-section">
            <div class="inventory-title">INVENTORY</div>
            <div id="inventory-list">
                <!-- 아이템이 여기에 추가됨 -->
            </div>
        </div>
    </div>

    <!-- 핸드아웃 모달 (디자인 포함) -->
    <div id="handout-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:10000; width:90%; max-width:400px;">
        <div id="card-front" class="insane-card">
            <div class="card-header">Handout</div>
            <div class="card-info-table">
                <div class="info-label-card">이름</div>
                <div class="info-value" id="modal-title" style="padding:5px 10px;"></div>
            </div>
            <div style="text-align:center; background:#eee; font-size:0.8rem; font-weight:bold; padding:3px; border-bottom:1px solid #000;">사 명</div>
            <div class="card-content" id="modal-content"></div>
            <button onclick="revealSecretInModal()" style="width:100%; padding:12px; background:#000; color:#fff; border:none; cursor:pointer; font-weight:bold;">비밀 확인</button>
        </div>
        <div id="card-back" class="insane-card secret-card" style="display:none;">
            <div class="card-header">Handout</div>
            <div class="card-info-table" style="border-color:#fff;"><div class="info-label-card" style="background:#222; color:#fff; border-color:#fff;">비밀</div><div class="info-value"></div></div>
            <div class="card-info-table" style="border-color:#fff;"><div class="info-label-card" style="background:#222; color:#fff; border-color:#fff;">쇼크</div><div id="modal-shock" style="padding:5px 10px;"></div></div>
            <div class="card-content" id="modal-secret-text"></div>
            <div style="padding:10px; text-align:center; font-size:0.7rem;">이 비밀을 스스로 밝힐 수는 없다.</div>
        </div>
        <button onclick="closeHandout()" style="width:100%; margin-top:10px; padding:10px; background:#333; color:#fff; border:none; cursor:pointer;">창 닫기</button>
    </div>

    <!-- 파이어베이스 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const btn = document.getElementById('roll-btn');
        const resBox = document.getElementById('dice-result');

        // --- 1. 주사위 기능 ---
        btn.addEventListener('click', () => {
            btn.disabled = true;
            resBox.innerText = "판정 중...";
            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('die1').innerText = Math.floor(Math.random() * 6) + 1;
                document.getElementById('die2').innerText = Math.floor(Math.random() * 6) + 1;
                if(++count > 10) {
                    clearInterval(timer);
                    const f1 = Math.floor(Math.random() * 6) + 1;
                    const f2 = Math.floor(Math.random() * 6) + 1;
                    const total = f1 + f2;
                    document.getElementById('die1').innerText = f1; document.getElementById('die2').innerText = f2;
                    if (total === 2) resBox.innerHTML = `<span class="fumble">펌블 (2)</span>`;
                    else if (total === 12) resBox.innerHTML = `<span class="special">스페셜 (12)</span>`;
                    else resBox.innerHTML = `결과: ${total}`;
                    update(ref(db, 'room_01/pc1'), { lastDice: total });
                    btn.disabled = false;
                }
            }, 50);
        });

        // --- 2. 동기화 (GM -> PC) ---
        onValue(ref(db, 'room_01/pc1'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                if(data.hp !== undefined) document.getElementById('hp-val').innerText = data.hp;
                if(data.san !== undefined) document.getElementById('san-val').innerText = data.san;
                if(data.name && document.activeElement !== document.getElementById('char-name')) {
                    document.getElementById('char-name').value = data.name;
                }
                if(data.note && document.activeElement !== document.getElementById('char-note')) {
                    document.getElementById('char-note').value = data.note;
                }
            }
        });

        window.syncProfile = () => {
            update(ref(db, 'room_01/pc1'), {
                name: document.getElementById('char-name').value,
                note: document.getElementById('char-note').value
            });
        };

        // --- 3. 핸드아웃 수신 ---
        const invRef = ref(db, 'room_01/pc1/inventory');
        let isInitialLoad = true;
        onValue(invRef, () => { isInitialLoad = false; }, { onlyOnce: true });

        onChildAdded(invRef, (snapshot) => {
            const item = snapshot.val();
            const list = document.getElementById('inventory-list');
            const shockInfo = `${item.trigger || '전원'} / ${item.shock || '없음'}`;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-slot';
            itemDiv.innerText = item.title;
            itemDiv.onclick = () => window.showHandout(item.title, item.content, item.secret, shockInfo);
            list.appendChild(itemDiv);
            if (!isInitialLoad) window.showHandout(item.title, item.content, item.secret, shockInfo);
        });

        window.showHandout = (title, content, secret, shock) => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerText = content;
            document.getElementById('modal-secret-text').innerText = secret;
            document.getElementById('modal-shock').innerText = shock;
            document.getElementById('card-front').style.display = "block";
            document.getElementById('card-back').style.display = "none";
            document.getElementById('handout-modal').style.display = "block";
        };

        window.revealSecretInModal = () => {
            if(confirm("비밀을 확인하시겠습니까?")) {
                document.getElementById('card-front').style.display = "none";
                document.getElementById('card-back').style.display = "block";
            }
        };

        window.closeHandout = () => { document.getElementById('handout-modal').style.display = "none"; };
    </script>
</body>
</html>

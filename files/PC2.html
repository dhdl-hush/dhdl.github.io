<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 상단 헤더 */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(10, 10, 10, 0.9);
        }

        h1 {
            color: #b30000;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 0;
        }

        /* 메인 컨텐츠 영역 */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #222;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* 상태 바 (생명력, 이성치) */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-box {
            border: 1px solid #444;
            padding: 15px;
            text-align: center;
        }

        .status-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
            display: block;
        }

        .status-value {
            font-size: 2rem;
            color: #fff;
            font-weight: bold;
        }

        /* 주사위 섹션 추가 스타일 */
        .dice-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px double #333;
            text-align: center;
            background: rgba(20, 20, 20, 0.5);
        }

        .dice-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .die {
            width: 60px;
            height: 60px;
            background: #1a1a1a;
            border: 2px solid #b30000;
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(179, 0, 0, 0.3);
        }

        #dice-result-text {
            font-size: 1.1rem;
            min-height: 1.5rem;
            margin-bottom: 15px;
            color: #aaa;
        }

        .roll-btn {
            background: transparent;
            color: #b30000;
            border: 1px solid #b30000;
            padding: 12px 40px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 3px;
            transition: all 0.3s;
        }

        .roll-btn:hover {
            background: #b30000;
            color: #fff;
            box-shadow: 0 0 15px #b30000;
        }

        /* 결과 강조 효과 */
        .fumble { color: #ff0000; animation: shake 0.2s infinite; text-shadow: 0 0 10px red; font-weight: bold; }
        .special { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }
        .normal { color: #fff; font-weight: bold; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-2px, 1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* 비밀(Secret) 영역 */
        .secret-section {
            margin-top: 40px;
            border: 1px solid #b30000;
            padding: 20px;
            background: rgba(179, 0, 0, 0.05);
            position: relative;
        }

        .secret-title {
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .secret-content {
            font-size: 0.95rem;
            line-height: 1.6;
            filter: blur(5px);
            transition: filter 0.5s;
            user-select: none;
        }

        .secret-section:hover .secret-content {
            filter: blur(0);
        }

        /* 하단 버튼 */
        .footer-nav {
            margin-top: auto;
            padding: 40px;
        }

        .back-btn {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #b30000;
        }

        /* 노이즈 효과 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <header>
        <h1>PC1: [캐릭터 이름]</h1>
    </header>

    <div class="container">
        <!-- 1. 상태 정보 -->
        <div class="status-grid">
            <div class="status-box">
                <span class="status-label">생명력</span>
                <span class="status-value">6 / 6</span>
            </div>
            <div class="status-box">
                <span class="status-label">이성치</span>
                <span class="status-value">6 / 6</span>
            </div>
        </div>

        <!-- 2. 주사위 판정 영역 (추가된 부분) -->
        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result-text">행동 판정이 필요할 때 주사위를 굴리세요.</div>
            <button class="roll-btn" onclick="rollDice()">ROLL DICE</button>
        </div>

        <!-- 3. 사명 -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: #888; font-size: 0.9rem; border-left: 3px solid #b30000; padding-left: 10px;">공개된 사명</h3>
            <p>당신의 사명은 이 저택에서 무사히 살아나가는 것입니다.</p>
        </div>

        <!-- 4. 비밀 -->
        <div class="secret-section">
            <div class="secret-title">
                ⚠️ [비밀: 쇼크 - 정신 오염]
            </div>
            <div class="secret-content">
                사실 당신은 이 저택의 주인을 죽인 범인입니다. <br>
                당신의 진짜 사명은 자신의 정체가 들키지 않은 채 다른 사람들을 모두 희생시키는 것입니다.
            </div>
            <div style="font-size: 0.7rem; color: #444; margin-top: 10px;">
                * 마우스를 올리면 내용이 보입니다.
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <a href="../index.html" class="back-btn">메인화면으로 돌아가기</a>
    </div>

    <!-- 주사위 로직 스크립트 -->
    <script>
        function rollDice() {
            const btn = document.querySelector('.roll-btn');
            const resText = document.getElementById('dice-result-text');
            const d1Element = document.getElementById('die1');
            const d2Element = document.getElementById('die2');

            btn.disabled = true;
            resText.innerHTML = "운명에 맡기는 중...";
            resText.className = "";

            let count = 0;
            const interval = setInterval(() => {
                d1Element.innerText = Math.floor(Math.random() * 6) + 1;
                d2Element.innerText = Math.floor(Math.random() * 6) + 1;
                count++;

                if (count > 12) {
                    clearInterval(interval);
                    
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    const total = d1 + d2;

                    d1Element.innerText = d1;
                    d2Element.innerText = d2;

                    if (total === 2) {
                        resText.innerHTML = `결과: ${total} - <span class="fumble">펌블 (Fumble)</span>`;
                    } else if (total === 12) {
                        resText.innerHTML = `결과: ${total} - <span class="special">스페셜 (Special)</span>`;
                    } else {
                        resText.innerHTML = `결과: ${total} - <span class="normal">성공 여부를 확인하세요.</span>`;
                    }

                    btn.disabled = false;
                }
            }, 50);
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - PC1</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #050505; color: #d1d1d1;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .container {
            width: 90%; max-width: 600px; margin: 30px auto;
            padding: 20px; border: 1px solid #222; background: #0a0a0a;
        }

        h1 { color: #b30000; font-size: 1.5rem; text-align: center; letter-spacing: 5px; }

        /* 주사위 섹션 스타일 */
        .dice-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px double #444;
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
        }

        .dice-display {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;
        }

        .die {
            width: 50px; height: 50px;
            background: #1a1a1a; border: 2px solid #b30000;
            color: #fff; font-size: 1.8rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px;
            text-shadow: 0 0 5px #ff0000;
        }

        #dice-result-text {
            font-size: 1.2rem; min-height: 1.5rem; margin-bottom: 15px; font-weight: bold;
        }

        .roll-btn {
            background: transparent; color: #b30000; border: 1px solid #b30000;
            padding: 10px 30px; cursor: pointer; font-size: 1rem; letter-spacing: 2px;
            transition: all 0.2s;
        }

        .roll-btn:hover { background: #b30000; color: #fff; box-shadow: 0 0 10px #b30000; }

        /* 결과 강조 효과 */
        .fumble { color: #ff0000; animation: shake 0.2s infinite; text-shadow: 0 0 10px red; }
        .special { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .normal { color: #fff; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-2px, 1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* 기타 스타일 */
        .status-box { border: 1px solid #333; padding: 10px; text-align: center; margin-bottom: 20px; }
        .secret-box { 
            border: 1px solid #b30000; padding: 15px; background: #110000; 
            cursor: pointer; filter: blur(4px); transition: 0.3s;
        }
        .secret-box:hover { filter: blur(0); }
    </style>
</head>
<body>

    <div class="container">
        <h1>PC1: 캐릭터 이름</h1>

        <div class="status-box">
            <span>생명력 6 / 6</span> | <span>이성치 6 / 6</span>
        </div>

        <!-- 주사위 판정 영역 -->
        <div class="dice-section">
            <div class="dice-display">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div id="dice-result-text">행동 판정을 해주세요.</div>
            <button class="roll-btn" onclick="rollDice()">주사위 굴리기</button>
        </div>

        <div class="secret-box">
            <strong style="color: #ff4d4d;">[비밀]</strong><br>
            여기에 비밀 내용을 입력하세요. 마우스를 올리면 보입니다.
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="../index.html" style="color: #555; text-decoration: none; font-size: 0.8rem;">메인으로 돌아가기</a>
        </div>
    </div>

    <script>
        function rollDice() {
            const btn = document.querySelector('.roll-btn');
            const resText = document.getElementById('dice-result-text');
            const d1Element = document.getElementById('die1');
            const d2Element = document.getElementById('die2');

            // 버튼 비활성화 (연타 방지)
            btn.disabled = true;
            resText.innerHTML = "굴리는 중...";
            resText.className = "";

            let count = 0;
            const interval = setInterval(() => {
                // 애니메이션 효과를 위한 랜덤 숫자
                d1Element.innerText = Math.floor(Math.random() * 6) + 1;
                d2Element.innerText = Math.floor(Math.random() * 6) + 1;
                count++;

                if (count > 10) { // 10회 흔들린 후 멈춤
                    clearInterval(interval);
                    
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    const total = d1 + d2;

                    d1Element.innerText = d1;
                    d2Element.innerText = d2;

                    // 결과 판정
                    if (total === 2) {
                        resText.innerHTML = `결과: ${total} - <span class="fumble">펌블 (Fumble)</span>`;
                    } else if (total === 12) {
                        resText.innerHTML = `결과: ${total} - <span class="special">스페셜 (Special)</span>`;
                    } else {
                        resText.innerHTML = `결과: ${total} - <span class="normal">성공 여부를 확인하세요.</span>`;
                    }

                    btn.disabled = false;
                }
            }, 50);
        }
    </script>
</body>
</html>

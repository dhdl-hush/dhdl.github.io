<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - GM DASHBOARD</title>
    <style>
        /* [스타일 태그 안에는 디자인 규칙만 적습니다] */
        body { margin: 0; padding: 20px; background: #050505; color: #d1d1d1; font-family: sans-serif; }
        h1 { color: #b30000; text-align: center; border-bottom: 2px solid #b30000; padding-bottom: 10px; }
        #pc-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .pc-card { border: 1px solid #333; background: #0a0a0a; padding: 20px; border-radius: 8px; transition: all 0.3s; }
        .pc-name { font-size: 1.2rem; color: #fff; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .stat-line { margin: 5px 0; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .stat-val { font-weight: bold; color: #ff4d4d; }
        .dice-box { margin-top: 15px; padding: 10px; background: #1a1a1a; text-align: center; border: 1px solid #b30000; }
        .dice-num { font-size: 2rem; font-weight: bold; color: #fff; }
        .fumble { border-color: red !important; box-shadow: 0 0 15px red; animation: shake 0.3s infinite; }
        .special { border-color: #00ffcc !important; box-shadow: 0 0 15px #00ffcc; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
        
        /* 핸드아웃 전송창 전용 디자인 */
        .handout-sender { margin-top: 50px; border: 1px solid #b30000; padding: 20px; background: #0a0a0a; }
        .handout-sender input, .handout-sender textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #333; box-sizing: border-box; }
        .handout-sender button { background: #b30000; color: white; border: none; padding: 10px 15px; cursor: pointer; margin-right: 5px; }
        .handout-sender button:hover { background: #ff0000; }

        /* 핸드아웃 카드 덱 스타일 */
.handout-deck {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 30px;
    padding: 20px;
    background: #0d0d0d;
    border: 1px solid #333;
}
.handout-card {
    background: #1a1a1a;
    border: 1px solid #b30000;
    padding: 15px;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
}
.handout-card h4 { margin: 0 0 10px 0; color: #ff4d4d; border-bottom: 1px solid #333; padding-bottom: 5px; }
.handout-card p { font-size: 0.85rem; color: #ccc; margin: 0 0 15px 0; flex-grow: 1; white-space: pre-wrap; }
.send-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.send-btns button { font-size: 0.7rem; padding: 5px; cursor: pointer; background: #333; color: white; border: none; }
.send-btns button:hover { background: #b30000; }
    </style>
</head>
<body>

    <h1>GM 모니터링 시스템</h1>
    <div id="connection-status" style="text-align: center; font-size: 0.8rem; color: #666;">연결 시도 중...</div>

    <!-- PC 상태 카드들이 보일 곳 -->
    <div id="pc-container"></div>

    <!-- 핸드아웃 직접 입력 전송창 -->
<div class="handout-sender">
    <h2 style="color: #b30000;">핸드아웃 직접 입력 전송</h2>
    <input type="text" id="ho-title" placeholder="아이템 이름 (예: 오래된 열쇠)">
    <textarea id="ho-content" placeholder="공개 정보 (사명) 내용을 입력하세요..."></textarea>
    <textarea id="ho-secret" placeholder="비밀 내용을 입력하세요..." style="border-color: #ff0000;"></textarea>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <input type="text" id="ho-shock" placeholder="쇼크 (예: 전원 / 1D6)" style="flex: 1;">
        <input type="text" id="ho-target" placeholder="대상 (예: 해당자)" style="flex: 1;">
    </div>
    <div>
        전송 대상: 
        <button onclick="sendHandout('pc1')">PC1</button>
        <button onclick="sendHandout('pc2')">PC2</button>
        <button onclick="sendHandout('pc3')">PC3</button>
        <button onclick="sendHandout('pc4')">PC4</button>
    </div>
</div>

    <h2 style="color: #b30000; margin-top: 40px; text-align: center;">시나리오 핸드아웃 덱</h2>
<div id="handout-deck" class="handout-deck">
    <!-- 자바스크립트에서 카드들을 여기에 채워넣을 겁니다 -->
</div>

    <!-- GM용 핸드아웃 확인 팝업 (PC와 동일한 디자인) -->
<div id="gm-view-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:10000; width:90%; max-width:420px; background: rgba(0,0,0,0.9); padding: 20px; border: 1px solid #b30000;">
    <div id="gm-card-view" class="insane-card secret">
        <div class="card-header">GM VIEW</div>
        <div class="card-info-table"><div class="info-label">이름</div><div class="info-value" id="gm-modal-title"></div></div>
        <div class="card-body-title">공개 정보</div>
        <div class="card-content" id="gm-modal-content" style="min-height:100px; font-size:0.8rem;"></div>
        <div class="card-body-title" style="color:red;">비 밀</div>
        <div class="card-content" id="gm-modal-secret" style="min-height:100px; color:#ffb3b3; font-size:0.8rem;"></div>
        <div class="card-info-table"><div class="info-label">쇼크</div><div class="info-value" id="gm-modal-shock"></div></div>
    </div>
    <button onclick="closeGmModal()" style="width:100%; margin-top:10px; padding:10px; background:#333; color:#fff; border:none; cursor:pointer;">창 닫기</button>
</div>

    <!-- 스크립트 시작 -->
    <script type="module">
        // 1. 도구는 맨 위에서 한 번만 가져옵니다! (push 추가)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. 설정값
        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };

        // 3. 초기화 (한 번만!)
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pcContainer = document.getElementById('pc-container');
        const statusText = document.getElementById('connection-status');

        // 4. [기능] PC 상태 실시간 감시 (수정 버전)
        onValue(ref(db, 'room_01'), (snapshot) => {
            statusText.innerText = "데이터 실시간 동기화 중 (" + new Date().toLocaleTimeString() + ")";
            const data = snapshot.val();
            if (!data) { pcContainer.innerHTML = "접속 데이터 없음"; return; }
            pcContainer.innerHTML = ""; 

            for (let pcId in data) {
                const pc = data[pcId];
                
                // --- 추가된 부분: 현재 수치 가져오기 ---
                const currentHp = (pc.hp !== undefined) ? pc.hp : 6;
                const currentSan = (pc.san !== undefined) ? pc.san : 6;

                const card = document.createElement('div');
                card.className = `pc-card ${pc.lastDice === 2 ? 'fumble' : ''} ${pc.lastDice === 12 ? 'special' : ''}`;
                
                // 인벤토리 목록 생성 (이 부분은 기존과 동일)
                let invHtml = '<div style="margin-top:10px; border-top:1px solid #222; padding-top:10px;">';
                invHtml += '<div style="font-size:0.8rem; color:#888; margin-bottom:5px;">보유 인벤토리:</div>';
                if (pc.inventory) {
                    for (let itemId in pc.inventory) {
                        const item = pc.inventory[itemId];
                        invHtml += `
                            <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:5px; margin-bottom:3px; font-size:0.8rem; border:1px solid #222;">
                                <span onclick="viewHandoutDetail('${pcId}', '${itemId}')" style="cursor:pointer; color:#00ffcc; text-decoration:underline;">- ${item.title}</span>
                                <button onclick="deleteItem('${pcId}', '${itemId}')" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-size:0.7rem; padding:0 5px;">[삭제]</button>
                            </div>
                        `;
                    }
                } else {
                    invHtml += '<div style="font-size:0.8rem; color:#444;">비어 있음</div>';
                }
                invHtml += '</div>';

                // --- 수정된 부분: 수치 조절 버튼 추가 ---
                card.innerHTML = `
                    <div class="pc-name">${pcId.toUpperCase()} : ${pc.name || '미설정'}</div>
                    <div style="font-size: 0.7rem; color: #666; margin-bottom: 10px;">${pc.note || ''}</div>
                    
                    <!-- 생명력 조절 -->
                    <div class="stat-line" style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>생명력</span> 
                        <div style="display:flex; align-items:center; gap:5px;">
                            <button onclick="changePCStat('${pcId}', 'hp', ${currentHp}, -1)">-</button>
                            <span class="stat-val" style="min-width:35px; text-align:center;">${currentHp} / 6</span>
                            <button onclick="changePCStat('${pcId}', 'hp', ${currentHp}, 1)">+</button>
                        </div>
                    </div>

                    <!-- 이성치 조절 -->
                    <div class="stat-line" style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>이성치</span> 
                        <div style="display:flex; align-items:center; gap:5px;">
                            <button onclick="changePCStat('${pcId}', 'san', ${currentSan}, -1)">-</button>
                            <span class="stat-val" style="min-width:35px; text-align:center;">${currentSan} / 6</span>
                            <button onclick="changePCStat('${pcId}', 'san', ${currentSan}, 1)">+</button>
                        </div>
                    </div>

                    <div class="dice-box"><div class="dice-num">${pc.lastDice || '?'}</div></div>
                    ${invHtml}
                `;
                pcContainer.appendChild(card); // 카드 화면에 추가
            }
        });

        // 5. [기능] 핸드아웃 전송 함수 (window에 연결해야 버튼이 인식함)
        window.sendHandout = function(pcId) {
            const title = document.getElementById('ho-title').value;
            const content = document.getElementById('ho-content').value;
            const secret = document.getElementById('ho-secret').value;
            const shock = document.getElementById('ho-shock').value;
            const target = document.getElementById('ho-target').value;

            if(!title || !content || !secret) return alert("이름, 내용, 비밀은 필수입니다.");

            const targetRef = ref(db, `room_01/${pcId}/inventory`);
            push(targetRef, {
                title: title,
                content: content,
                secret: secret,
                shock: shock || "없음",
                trigger: target || "전원",
                timestamp: Date.now()
            }).then(() => {
                alert(`${pcId.toUpperCase()}에게 전송했습니다.`);
                // 입력창 초기화
                document.getElementById('ho-title').value = "";
                document.getElementById('ho-content').value = "";
                document.getElementById('ho-secret').value = "";
                document.getElementById('ho-shock').value = "";
                document.getElementById('ho-target').value = "";
            });
        };

        // 아이템 삭제 함수
        window.deleteItem = function(pcId, itemId) {
            if(confirm("이 아이템을 PC의 인벤토리에서 삭제할까요?")) {
                const itemRef = ref(db, `room_01/${pcId}/inventory/${itemId}`);
                remove(itemRef).then(() => {
                    alert("삭제되었습니다.");
                });
            }
        }

        // 1. 시나리오 핸드아웃 리스트 (여기에 카드 내용을 미리 다 적어두세요!)
     // 시나리오 핸드아웃 리스트 (비밀 내용 추가)
        const handoutList = [
            { 
                title: "낡은 일기장", 
                content: "일기장에는 10월 13일의 기록이 피로 얼룩져 있다.",
                secret: "사실 일기장의 피는 당신의 것이다. 당신은 이 날의 기억이 없다.",
                shock: "전원 / 1D6", // 쇼크 수치
                target: "해당자"    // 쇼크 대상
        },
            { 
                title: "저택의 평면도", 
                content: "2층 창고 뒤에 숨겨진 통로가 그려져 있다.",
                secret: "비밀 통로 안쪽에는 수십 명의 실종자 명단이 붙어 있다."
            }
            // 필요한 만큼 계속 추가...
        ];
        // 2. 카드 덱 화면에 그리기
        const deckContainer = document.getElementById('handout-deck');
        handoutList.forEach((ho, index) => {
            const card = document.createElement('div');
            card.className = 'handout-card';
            card.innerHTML = `
                <h4>${ho.title}</h4>
                <p>${ho.content}</p>
                <div class="send-btns">
                    <button onclick="sendPreparedHandout('pc1', ${index})">PC1 전송</button>
                    <button onclick="sendPreparedHandout('pc2', ${index})">PC2 전송</button>
                    <button onclick="sendPreparedHandout('pc3', ${index})">PC3 전송</button>
                    <button onclick="sendPreparedHandout('pc4', ${index})">PC4 전송</button>
                </div>
            `;
            deckContainer.appendChild(card);
        });

        // 3. 카드 전송 함수
     window.sendPreparedHandout = function(pcId, index) {
    const selectedHandout = handoutList[index];
    const targetRef = ref(db, `room_01/${pcId}/inventory`);
    
    push(targetRef, {
        title: selectedHandout.title,
        content: selectedHandout.content,
        secret: selectedHandout.secret,
        shock: selectedHandout.shock || "없음",
        trigger: selectedHandout.target || "전원",
        timestamp: Date.now()
    }).then(() => {
        alert(`${pcId.toUpperCase()}에게 핸드아웃 전송 완료!`);
    });
};
        // GM이 PC의 핸드아웃 상세(비밀 포함) 보기
        window.viewHandoutDetail = function(pcId, itemId) {
            const dbRef = ref(db, `room_01/${pcId}/inventory/${itemId}`);
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if(!data) return;
                
                document.getElementById('gm-modal-title').innerText = data.title;
                document.getElementById('gm-modal-content').innerText = data.content;
                document.getElementById('gm-modal-secret').innerText = data.secret;
                document.getElementById('gm-modal-shock').innerText = data.shock || "없음";
                
                document.getElementById('gm-view-modal').style.display = "block";
            }, { onlyOnce: true });
        };

        window.closeGmModal = function() {
            document.getElementById('gm-view-modal').style.display = "none";
        };
    // GM이 플레이어의 HP/SAN 수치를 서버에서 변경하는 함수
        window.changePCStat = function(pcId, type, currentVal, amount) {
            // 0미만으로 내려가거나 6을 초과하지 않게 제한
            const newVal = Math.max(0, Math.min(6, currentVal + amount));
            
            // Firebase 서버에 업데이트
            update(ref(db, `room_01/${pcId}`), {
                [type]: newVal
            });
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE - GM DASHBOARD</title>
    <style>
        body { margin: 0; padding: 20px; background: #050505; color: #d1d1d1; font-family: sans-serif; }
        h1 { color: #b30000; text-align: center; border-bottom: 2px solid #b30000; padding-bottom: 10px; }
        
        /* PC 카드들이 나열될 그리드 */
        #pc-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        /* 각 PC 상태 카드 디자인 */
        .pc-card {
            border: 1px solid #333;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .pc-name { font-size: 1.2rem; color: #fff; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .stat-line { margin: 5px 0; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .stat-val { font-weight: bold; color: #ff4d4d; }

        .dice-box {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            text-align: center;
            border: 1px solid #b30000;
        }
        .dice-num { font-size: 2rem; font-weight: bold; color: #fff; }

        /* 상태 이상 효과 */
        .fumble { border-color: red !important; box-shadow: 0 0 15px red; animation: shake 0.3s infinite; }
        .special { border-color: #00ffcc !important; box-shadow: 0 0 15px #00ffcc; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }
    </style>
</head>
<body>

    <h1>GM 모니터링 시스템</h1>
    <div id="connection-status" style="text-align: center; font-size: 0.8rem; color: #666;">연결 시도 중...</div>

    <div id="pc-container">
        <!-- 파이어베이스 데이터가 여기에 실시간으로 들어옵니다 -->
    </div>

    <!-- 파이어베이스 SDK 연결 (반드시 type="module" 이어야 함) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 주의: 본인의 firebaseConfig로 반드시 교체하세요!
        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };

        // 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pcContainer = document.getElementById('pc-container');
        const statusText = document.getElementById('connection-status');

        // room_01 노드의 데이터 감시 시작
        const roomRef = ref(db, 'room_01');
        
        onValue(roomRef, (snapshot) => {
            statusText.innerText = "데이터 실시간 동기화 중 (마지막 업데이트: " + new Date().toLocaleTimeString() + ")";
            const data = snapshot.val();
            
            if (!data) {
                pcContainer.innerHTML = "<p style='text-align:center;'>접속된 PC가 없거나 데이터가 없습니다.</p>";
                return;
            }

            pcContainer.innerHTML = ""; // 화면 초기화

            // PC별로 카드 생성
            for (let pcId in data) {
                const pc = data[pcId];
                const isFumble = pc.lastDice === 2;
                const isSpecial = pc.lastDice === 12;

                const card = document.createElement('div');
                card.className = `pc-card ${isFumble ? 'fumble' : ''} ${isSpecial ? 'special' : ''}`;
                
                card.innerHTML = `
                    <div class="pc-name">${pcId.toUpperCase()} : ${pc.name || '미설정'}</div>
                    <div class="stat-line"><span>생명력</span> <span class="stat-val">${pc.hp || 6} / 6</span></div>
                    <div class="stat-line"><span>이성치</span> <span class="stat-val">${pc.san || 6} / 6</span></div>
                    <div class="dice-box">
                        <div style="font-size: 0.7rem; color: #888;">최근 판정 결과</div>
                        <div class="dice-num">${pc.lastDice || '?'}</div>
                        <div style="font-size: 0.8rem;">${isFumble ? '펌블!' : isSpecial ? '스페셜!' : '성공여부 확인'}</div>
                    </div>
                `;
                pcContainer.appendChild(card);
            }
        }, (error) => {
            console.error("데이터 읽기 실패:", error);
            statusText.innerText = "오류 발생: " + error.message;
        });
    </script>
</body>
</html>

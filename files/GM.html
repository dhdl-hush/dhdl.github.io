<!-- GM 대시보드 구조 -->
<div id="pc-container" style="display: flex; gap: 20px;">
    <!-- 여기에 PC들의 카드가 실시간으로 생성됨 -->
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { /* 본인의 설정값 */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const pcContainer = document.getElementById('pc-container');

    // 데이터베이스 감시
    onValue(ref(db, 'room_01'), (snapshot) => {
        const data = snapshot.val();
        pcContainer.innerHTML = ""; // 화면 초기화 후 다시 그리기

        for (let pcId in data) {
            const pc = data[pcId];
            const card = `
                <div class="pc-card" style="border: 1px solid ${pc.lastDice === 2 ? 'red' : '#333'}; padding: 15px; background: #111; color: white;">
                    <h3>${pcId.toUpperCase()} (${pc.name})</h3>
                    <p>생명력: ${pc.hp} | 이성치: ${pc.san}</p>
                    <p style="font-size: 1.5rem;">최근 주사위: <strong>${pc.lastDice}</strong></p>
                    ${pc.lastDice === 2 ? '<b style="color:red;">⚠️ 펌블 발생!</b>' : ''}
                </div>
            `;
            pcContainer.innerHTML += card;
        }
    });
</script>

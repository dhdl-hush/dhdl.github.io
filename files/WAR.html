<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>INSANE - KISARAGI STATION COMBAT</title>
    <style>
        body { margin: 0; padding: 0; background: #050505; color: #eee; font-family: sans-serif; overflow: hidden; }
        .war-layout { display: grid; grid-template-columns: 300px 1fr 300px; height: 100vh; }
        
        /* 왼쪽: 내 캐릭터 정보 */
        .my-side { background: #0a0a0a; border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; }
        
        /* 중앙: 보스 스테이지 + 이니셔티브 트랙 */
        .center-stage { display: flex; flex-direction: column; height: 100vh; background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png'); }
        
        /* 보스 전용 상단 UI */
        .boss-area { 
            background: linear-gradient(to bottom, #200, #000); 
            padding: 30px; text-align: center; border-bottom: 2px solid #b30000;
            box-shadow: 0 10px 30px rgba(179,0,0,0.5);
        }
        .boss-name { font-size: 2.5rem; color: #ff4d4d; font-weight: bold; letter-spacing: 10px; text-shadow: 0 0 20px red; margin-bottom: 15px; }
        .boss-stats { display: flex; justify-content: center; gap: 30px; font-size: 1.5rem; font-weight: bold; }
        .boss-hp { color: #ff4d4d; } .boss-san { color: #00ffcc; }

        /* 플레이어 플롯 트랙 */
        .battle-track { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .plot-row { background: rgba(20,20,20,0.9); border: 1px solid #333; min-height: 60px; display: flex; align-items: center; padding: 0 20px; gap: 20px; }
        .plot-num { font-size: 2rem; font-weight: bold; color: #b30000; width: 40px; }
        .token-area { display: flex; gap: 10px; }
        .token { padding: 8px 15px; background: #b30000; color: white; border-radius: 3px; font-weight: bold; box-shadow: 0 0 10px rgba(255,0,0,0.3); }

        /* 오른쪽: 주사위 및 상태 */
        .status-side { background: #0a0a0a; border-left: 1px solid #333; padding: 20px; text-align: center; }
        #dice-val { font-size: 4rem; font-weight: bold; margin: 20px 0; color: #fff; text-shadow: 0 0 20px #b30000; }

        /* 버튼 및 기타 */
        .plot-btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .plot-btn { padding: 15px; background: #1a1a1a; border: 1px solid #444; color: white; cursor: pointer; font-weight: bold; }
        .plot-btn.active { background: #b30000; border-color: #ff4d4d; }
        .roll-btn { width: 100%; padding: 15px; background: #b30000; color: white; border: none; font-weight: bold; cursor: pointer; letter-spacing: 5px; }
        .gm-controls { margin-top: auto; border-top: 1px solid #444; padding-top: 20px; }
    </style>
</head>
<body>

<div class="war-layout">
    <!-- 1. 왼쪽: 내 컨트롤러 -->
    <div class="my-side">
        <h2 id="my-name">PLAYER</h2>
        <div style="font-size:1.2rem; font-weight:bold; margin-bottom:20px;">
            HP: <span id="my-hp" style="color:#ff4d4d;">6</span> / 
            SAN: <span id="my-san" style="color:#00ffcc;">6</span>
        </div>
        <hr style="width:100%; border:0.5px solid #222;">
        <h3>PLOT CHOICE</h3>
        <div class="plot-btn-group" id="plot-buttons">
            <button class="plot-btn" onclick="submitPlot(1)">1</button>
            <button class="plot-btn" onclick="submitPlot(2)">2</button>
            <button class="plot-btn" onclick="submitPlot(3)">3</button>
            <button class="plot-btn" onclick="submitPlot(4)">4</button>
            <button class="plot-btn" onclick="submitPlot(5)">5</button>
            <button class="plot-btn" onclick="submitPlot(6)">6</button>
        </div>
        
        <div id="gm-only" style="display:none;" class="gm-controls">
            <h4 style="color:#888; margin-bottom:10px;">GM CONTROL</h4>
            <button onclick="revealPlots()" style="width:100%; padding:12px; background:#b30000; color:white; border:none; margin-bottom:10px; cursor:pointer;">📣 플롯 일제 공개</button>
            <button onclick="nextRound()" style="width:100%; padding:10px; background:#333; color:white; border:none; cursor:pointer;">🔄 다음 라운드</button>
            <button onclick="endWar()" style="width:100%; padding:10px; background:black; color:gray; border:none; margin-top:20px; cursor:pointer;">전투 종료</button>
        </div>
    </div>

    <!-- 2. 중앙: 보스 스테이지 + 트랙 -->
    <div class="center-stage">
        <div class="boss-area">
            <div class="boss-name" id="boss-name">괴이 등장</div>
            <div class="boss-stats">
                <span class="boss-hp">HP: <span id="boss-hp-val">?</span></span>
                <span class="boss-san">SAN: <span id="boss-san-val">?</span></span>
            </div>
        </div>
        <div class="battle-track" id="battle-track">
            <!-- PC들만 여기에 배치됨 -->
        </div>
    </div>

    <!-- 3. 오른쪽: 주사위 패널 -->
    <div class="status-side">
        <h2>DICE ROLL</h2>
        <div id="dice-val">?</div>
        <button class="roll-btn" onclick="rollCombatDice()">ROLL</button>
        <div id="ready-status" style="margin-top:30px; color:#666; font-size:0.9rem;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ⚠️ 본인의 콘솔 값으로 채우세요!
        const firebaseConfig = {
          apiKey: "AIzaSyAUjW1D8bQ_P1o0GQpSo2zAswwA7SvT97I",
          authDomain: "dhdl-48b4a.firebaseapp.com",
          projectId: "dhdl-48b4a",
          storageBucket: "dhdl-48b4a.firebasestorage.app",
          messagingSenderId: "970954764585",
          appId: "1:970954764585:web:7388d241cc77ec70dd8738",
          measurementId: "G-DV6XRPBJV4"
        };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const myId = urlParams.get('id') || 'pc1';
    const isGM = myId === 'gm';
    
    if(isGM) document.getElementById('gm-only').style.display = 'block';

    // 데이터 감시 및 화면 갱신
    onValue(ref(db, 'room_01'), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        // [1. 내 정보 업데이트]
        const me = isGM ? {name: "GM", hp: "-", san: "-"} : data[myId];
        document.getElementById('my-name').innerText = me.name;
        document.getElementById('my-hp').innerText = me.hp;
        document.getElementById('my-san').innerText = me.san;

        // [2. 보스 정보 업데이트 (중앙 상단)]
        const boss = data.npc || { name: "괴이", hp: 0, san: 0 };
        document.getElementById('boss-name').innerText = boss.name;
        document.getElementById('boss-hp-val').innerText = boss.hp;
        document.getElementById('boss-san-val').innerText = boss.san;

        // [3. 플롯 트랙 그리기 (PC 전용)]
        const track = document.getElementById('battle-track');
        track.innerHTML = "";
        const isRevealed = data.battle.status === 'revealed';

        for(let i=6; i>=1; i--) {
            const row = document.createElement('div');
            row.className = 'plot-row';
            row.innerHTML = `<div class="plot-num">${i}</div><div class="token-area" id="plot-${i}"></div>`;
            track.appendChild(row);
        }

        // [4. PC들만 트랙에 배치]
        const pcs = ['pc1', 'pc2', 'pc3', 'pc4'];
        let readyCount = 0;
        let totalPCs = 0;

        pcs.forEach(id => {
            if(data[id]) {
                totalPCs++;
                if(data[id].plotReady) {
                    readyCount++;
                    if(isRevealed) {
                        const area = document.getElementById(`plot-${data[id].currentPlot}`);
                        if(area) area.innerHTML += `<div class="token">${data[id].name}</div>`;
                    }
                }
            }
        });
        
        document.getElementById('ready-status').innerText = `PC 준비 완료: ${readyCount} / ${totalPCs}`;
    });

    // 플롯 선택
    window.submitPlot = (num) => {
        if(isGM) return alert("GM(괴이)은 플롯 트랙에 참여하지 않습니다.");
        update(ref(db, `room_01/${myId}`), { currentPlot: num, plotReady: true });
        const btns = document.querySelectorAll('.plot-btn');
        btns.forEach((b, i) => b.classList.toggle('active', i+1 === num));
    };

    // GM 제어 함수들
    window.revealPlots = () => update(ref(db, 'room_01/battle'), { status: 'revealed' });
    window.nextRound = () => {
        const updates = {};
        ['pc1','pc2','pc3','pc4'].forEach(id => {
            updates[`room_01/${id}/plotReady`] = false;
            updates[`room_01/${id}/currentPlot`] = 0;
        });
        updates['room_01/battle/status'] = 'waiting';
        update(ref(db), updates);
        const btns = document.querySelectorAll('.plot-btn');
        btns.forEach(b => b.classList.remove('active'));
    };
    window.endWar = () => {
        if(confirm("전투를 종료하고 시트 화면으로 돌아갈까요?")) {
            update(ref(db, 'room_01/battle'), { active: false }).then(() => {
                window.location.href = isGM ? 'GM.html' : 'PC1.html'; // 각자 페이지로 복귀
            });
        }
    };

    // 주사위 굴리기
    window.rollCombatDice = () => {
        const diceBox = document.getElementById('dice-val');
        let count = 0;
        const timer = setInterval(() => {
            diceBox.innerText = (Math.floor(Math.random()*6)+1) + (Math.floor(Math.random()*6)+1);
            if(++count > 10) {
                clearInterval(timer);
                diceBox.style.color = "#ff4d4d";
                setTimeout(() => diceBox.style.color = "#fff", 1000);
            }
        }, 50);
    };
</script>
</body>
</html>

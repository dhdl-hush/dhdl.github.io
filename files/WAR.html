<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>INSANE - COMBAT FIELD</title>
    <style>
        body { margin: 0; padding: 0; background: #050505; color: #eee; font-family: sans-serif; overflow-x: hidden; }
        .war-layout { display: grid; grid-template-columns: 300px 1fr 300px; height: 100vh; }
        
        /* 왼쪽: 내 캐릭터 정보 */
        .my-side { background: #0a0a0a; border-right: 1px solid #333; padding: 20px; }
        
        /* 중앙: 이니셔티브 트랙 (6~1) */
        .battle-track { padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .plot-row { background: rgba(20,20,20,0.8); border: 1px solid #222; min-height: 80px; display: flex; align-items: center; padding: 0 20px; gap: 20px; }
        .plot-num { font-size: 2.5rem; font-weight: bold; color: #b30000; width: 50px; }
        .token-area { display: flex; gap: 10px; }
        .token { padding: 10px 20px; background: #b30000; color: white; border-radius: 5px; font-weight: bold; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .token.boss { background: #550000; border: 2px solid gold; }

        /* 오른쪽: 로그 및 대기 명단 */
        .status-side { background: #0a0a0a; border-left: 1px solid #333; padding: 20px; }

        /* 플롯 버튼 */
        .plot-btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .plot-btn { padding: 15px; background: #222; border: 1px solid #444; color: white; cursor: pointer; }
        .plot-btn.active { background: #b30000; border-color: #ff4d4d; }
        
        /* 공통 UI */
        .hp-san { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .hp-bar { color: #ff4d4d; } .san-bar { color: #00ffcc; }
        .gm-controls { margin-top: 30px; border-top: 1px solid #444; padding-top: 20px; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<div class="war-layout">
    <!-- 1. 왼쪽: 내 컨트롤러 -->
    <div class="my-side">
        <h2 id="my-name">LOADING...</h2>
        <div class="hp-san">
            HP: <span id="my-hp" class="hp-bar">6</span> / 
            SAN: <span id="my-san" class="san-bar">6</span>
        </div>
        <hr>
        <h3>PLOT 선택</h3>
        <div class="plot-btn-group" id="plot-buttons">
            <button class="plot-btn" onclick="submitPlot(1)">1</button>
            <button class="plot-btn" onclick="submitPlot(2)">2</button>
            <button class="plot-btn" onclick="submitPlot(3)">3</button>
            <button class="plot-btn" onclick="submitPlot(4)">4</button>
            <button class="plot-btn" onclick="submitPlot(5)">5</button>
            <button class="plot-btn" onclick="submitPlot(6)">6</button>
        </div>
        
        <!-- GM 전용 버튼 (처음엔 숨김) -->
        <div id="gm-only" style="display:none;" class="gm-controls">
            <button onclick="revealPlots()" style="width:100%; padding:15px; background:#b30000; color:white; border:none; margin-bottom:10px;">📣 플롯 일제 공개</button>
            <button onclick="nextRound()" style="width:100%; padding:10px; background:#333; color:white; border:none;">🔄 다음 라운드</button>
            <button onclick="endWar()" style="width:100%; padding:5px; background:black; color:gray; border:none; margin-top:20px;">전투 종료 (복귀)</button>
        </div>
    </div>

    <!-- 2. 중앙: 전황판 -->
    <div class="battle-track" id="battle-track">
        <!-- 6~1까지 자동 생성 -->
    </div>

    <!-- 3. 오른쪽: 주사위 및 상태 -->
    <div class="status-side">
        <h2 style="text-align:center;">DICE</h2>
        <div id="dice-area" style="text-align:center; padding:20px; background:#111; border:1px solid #b30000;">
            <div id="dice-val" style="font-size:3rem; font-weight:bold;">?</div>
            <button onclick="rollCombatDice()" style="width:100%; padding:10px; margin-top:10px; background:#b30000; color:white; border:none;">ROLL</button>
        </div>
        <div id="ready-status" style="margin-top:20px; font-size:0.9rem; color:#888;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { /* 본인 설정값 */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 내가 누구인지 URL에서 가져옴 (?id=pc1 또는 ?id=gm)
    const urlParams = new URLSearchParams(window.location.search);
    const myId = urlParams.get('id') || 'pc1';
    const isGM = myId === 'gm';
    
    if(isGM) document.getElementById('gm-only').style.display = 'block';

    // 1. 데이터 실시간 바인딩 (메인 루프)
    onValue(ref(db, 'room_01'), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        // [내 정보 업데이트]
        const me = isGM ? data.npc : data[myId];
        document.getElementById('my-name').innerText = me.name + (isGM ? " (BOSS)" : "");
        document.getElementById('my-hp').innerText = me.hp;
        document.getElementById('my-san').innerText = me.san;

        // [플롯 트랙 그리기]
        const track = document.getElementById('battle-track');
        track.innerHTML = "";
        const isRevealed = data.battle.status === 'revealed';

        for(let i=6; i>=1; i--) {
            const row = document.createElement('div');
            row.className = 'plot-row';
            row.innerHTML = `<div class="plot-num">${i}</div><div class="token-area" id="plot-${i}"></div>`;
            track.appendChild(row);
        }

        // [캐릭터들 배치]
        const participants = ['pc1', 'pc2', 'pc3', 'pc4', 'npc'];
        let readyCount = 0;

        participants.forEach(id => {
            const p = data[id];
            if(p && p.plotReady) {
                readyCount++;
                if(isRevealed) {
                    const area = document.getElementById(`plot-${p.currentPlot}`);
                    if(area) area.innerHTML += `<div class="token ${id === 'npc' ? 'boss' : ''}">${p.name}</div>`;
                }
            }
        });
        
        document.getElementById('ready-status').innerText = `준비 완료: ${readyCount} / ${participants.filter(id=>data[id]).length}`;
    });

    // 2. 플롯 제출
    window.submitPlot = function(num) {
        const path = isGM ? 'room_01/npc' : `room_01/${myId}`;
        update(ref(db, path), { currentPlot: num, plotReady: true });
        
        const btns = document.querySelectorAll('.plot-btn');
        btns.forEach((b, i) => b.classList.toggle('active', i+1 === num));
    };

    // 3. GM 기능
    window.revealPlots = () => update(ref(db, 'room_01/battle'), { status: 'revealed' });
    window.nextRound = () => {
        const updates = {};
        ['pc1','pc2','pc3','pc4','npc'].forEach(id => {
            updates[`room_01/${id}/plotReady`] = false;
            updates[`room_01/${id}/currentPlot`] = 0;
        });
        updates['room_01/battle/status'] = 'waiting';
        update(ref(db), updates);
    };
    window.endWar = () => {
        update(ref(db, 'room_01/battle'), { active: false }).then(() => {
            window.location.href = 'GM.html';
        });
    };

    // 4. 전투 주사위
    window.rollCombatDice = function() {
        const diceBox = document.getElementById('dice-val');
        let count = 0;
        const timer = setInterval(() => {
            const d1 = Math.floor(Math.random()*6)+1;
            const d2 = Math.floor(Math.random()*6)+1;
            diceBox.innerText = d1 + d2;
            if(++count > 10) {
                clearInterval(timer);
                const final = (Math.floor(Math.random()*6)+1) + (Math.floor(Math.random()*6)+1);
                diceBox.innerText = final;
                // 필요시 여기에 결과 전송 로직 추가
            }
        }, 50);
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TRPG 인세인 서포터</title>
    <style>
        /* 다크 모드 스타일 (호러 분위기) */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { color: #b30000; text-shadow: 2px 2px 4px #000; }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 주사위 섹션 */
        .dice-area { text-align: center; margin-bottom: 20px; width: 100%; }
        button {
            background: #b30000;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        button:hover { background: #ff0000; }
        #dice-result { font-size: 24px; margin-top: 10px; font-weight: bold; }

        /* 캐릭터 상태창 */
        .stat-input { width: 40px; background: #333; color: #fff; border: 1px solid #555; text-align: center; }

        /* 핸드아웃(비밀) 섹션 */
        .handout {
            background: #fdfdfd;
            color: #333;
            padding: 10px;
            margin-top: 10px;
            border-left: 5px solid #b30000;
            cursor: pointer;
        }
        .secret { display: none; background: #ffe6e6; padding: 10px; margin-top: 5px; border-top: 1px dashed #b30000; }
        .revealed { display: block !important; }

        .label { font-weight: bold; color: #b30000; }
    </style>
</head>
<body>

    <h1>INSANE SESSION HELPER</h1>

    <!-- 주사위 굴리기 -->
    <div class="card dice-area">
        <button onclick="rollDice()">2d6 주사위 굴리기</button>
        <div id="dice-result">결과: -</div>
    </div>

    <div class="container">
        <!-- 캐릭터 상태창 -->
        <div class="card">
            <h2>캐릭터 상태</h2>
            <p>이름: <input type="text" placeholder="PC 이름" style="background:#333; color:white; border:1px solid #555;"></p>
            <p>생명력: <input type="number" class="stat-input" value="6"> / 6</p>
            <p>이성치: <input type="number" class="stat-input" value="6"> / 6</p>
            <hr>
            <h3>광기 카드</h3>
            <textarea style="width:90%; height:60px; background:#333; color:white;"></textarea>
        </div>

        <!-- 핸드아웃 관리 -->
        <div class="card">
            <h2>핸드아웃 / 비밀</h2>
            <div id="handout-container">
                <!-- 핸드아웃 예시 -->
                <div class="handout" onclick="toggleSecret(this)">
                    <div class="label">[사명]</div>
                    <div>당신은 이 저택에서 살아남아야 합니다.</div>
                    <div class="secret">
                        <strong>비밀:</strong> 사실 당신은 이 저택의 주인을 죽이러 온 자객입니다. (진정한 사명: 주인 NPC를 살해한다)
                    </div>
                </div>
            </div>
            <p style="font-size: 0.8em; color: #888; margin-top:10px;">* 핸드아웃을 클릭하면 비밀이 보입니다.</p>
        </div>
    </div>

    <script>
        // 주사위 로직 (사이코로 픽션은 2d6을 사용)
        function rollDice() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const total = d1 + d2;
            
            let message = `결과: ${d1} + ${d2} = ${total}`;
            
            if (total <= 2) message += " (펌블!)";
            if (total >= 12) message += " (스페셜!)";
            
            document.getElementById('dice-result').innerText = message;
        }

        // 비밀 보기 토글
        function toggleSecret(element) {
            const secret = element.querySelector('.secret');
            if (confirm("비밀을 확인하시겠습니까? (한 번 확인하면 되돌릴 수 없습니다)")) {
                secret.classList.toggle('revealed');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인세인 온라인 세션 툴</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1e1e1e;
            --accent-red: #b30000;
            --text-color: #d1d1d1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 홈 화면 (로그인) */
        #home-screen {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--accent-red);
            box-shadow: 0 0 20px rgba(179, 0, 0, 0.3);
        }

        input[type="text"] {
            background: #000;
            border: 1px solid var(--accent-red);
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        button {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #ff0000; transform: scale(1.05); }

        /* 게임 화면 (메인 영역) */
        #game-screen { display: none; width: 90%; max-width: 1100px; padding: 20px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        /* 주사위 및 상태창 */
        .stat-group { margin: 10px 0; }
        .stat-group label { display: inline-block; width: 70px; color: var(--accent-red); font-weight: bold; }
        .stat-group input { width: 50px; background: #000; border: 1px solid #444; color: white; text-align: center; }

        /* 핸드아웃 */
        .handout-box {
            background: #fff;
            color: #222;
            padding: 15px;
            margin-top: 15px;
            border-left: 10px solid var(--accent-red);
        }

        .secret-area {
            margin-top: 10px;
            padding: 10px;
            background: #eee;
            border: 1px dashed #999;
            display: none;
        }

        .secret-area.show { display: block; background: #ffdada; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 홈 화면 -->
    <div id="home-screen">
        <h1 style="color: var(--accent-red); letter-spacing: 5px;">INSANE</h1>
        <p>당신의 역할(ID)을 입력하세요</p>
        <p style="font-size: 0.8rem; color: #666;">(테스트용: PC1, PC2, GM 입력)</p>
        <input type="text" id="roleInput" placeholder="PC1 / PC2 / GM" onkeypress="if(event.keyCode==13) enterGame()">
        <br>
        <button onclick="enterGame()">접속하기</button>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="game-screen">
        <div class="header">
            <div>접속 중: <span id="display-role" style="color: var(--accent-red); font-weight: bold;">-</span></div>
            <button onclick="location.reload()" style="padding: 5px 10px; font-size: 0.8rem;">로그아웃</button>
        </div>

        <div class="grid">
            <!-- 왼쪽: 상태 및 주사위 -->
            <div class="card">
                <h3>캐릭터 상태</h3>
                <div class="stat-group">
                    <label>생명력</label> <input type="number" value="6"> / 6
                </div>
                <div class="stat-group">
                    <label>이성치</label> <input type="number" value="6"> / 6
                </div>
                <hr style="border: 0.5px solid #333;">
                <div style="text-align: center; margin-top: 20px;">
                    <div id="dice-result" style="font-size: 1.5rem; margin-bottom: 10px; height: 30px;">-</div>
                    <button onclick="rollDice()" style="width: 100%;">2d6 판정</button>
                </div>
            </div>

            <!-- 오른쪽: 사명과 비밀 -->
            <div class="card">
                <h3>나의 핸드아웃</h3>
                <div id="player-handout-area">
                    <!-- JS에서 데이터가 들어가는 곳 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 시나리오 데이터 (여기를 수정해서 시나리오를 준비하면 돼!)
        const gameData = {
            "PC1": {
                name: "탐정",
                mission: "이 저택에서 일어난 살인사건의 진상을 규명하십시오.",
                secret: "당신은 사실 범인과 한패입니다. 진상이 드러나지 않게 방해하세요."
            },
            "PC2": {
                name: "기자",
                mission: "특종을 잡기 위해 저택의 숨겨진 방을 찾으십시오.",
                secret: "당신은 과거에 이 저택 주인에게 가족을 잃었습니다. 복수가 진짜 목적입니다."
            },
            "GM": {
                name: "게임 마스터",
                mission: "원활한 진행을 돕고 공포를 선사하세요.",
                secret: "모든 PC의 비밀을 알고 있습니다. (이것은 GM 전용 화면입니다)"
            }
        };

        let currentRole = "";

        function enterGame() {
            const input = document.getElementById('roleInput').value.toUpperCase();
            
            if (gameData[input]) {
                currentRole = input;
                document.getElementById('home-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('display-role').innerText = `${input} (${gameData[input].name})`;
                
                renderHandout(input);
            } else {
                alert("등록되지 않은 역할입니다! (PC1, PC2, GM 중 하나를 입력해)");
            }
        }

        function renderHandout(role) {
            const area = document.getElementById('player-handout-area');
            const data = gameData[role];
            
            area.innerHTML = `
                <div class="handout-box">
                    <strong>[사명]</strong><br>
                    <p>${data.mission}</p>
                    <button onclick="toggleSecret()" id="secretBtn">비밀 확인 (클릭)</button>
                    <div id="secret-content" class="secret-area">
                        <strong>[비밀]</strong><br>
                        <p>${data.secret}</p>
                    </div>
                </div>
            `;
        }

        function toggleSecret() {
            const secretDiv = document.getElementById('secret-content');
            const btn = document.getElementById('secretBtn');
            
            if (confirm("비밀을 보시겠습니까? 이 작업은 되돌릴 수 없으며 GM에게 기록이 남을 수 있습니다.")) {
                secretDiv.classList.add('show');
                btn.style.display = 'none';
            }
        }

        function rollDice() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const total = d1 + d2;
            let resText = `${d1} + ${d2} = ${total}`;
            if (total <= 2) resText += " 💀 펌블!";
            if (total >= 12) resText += " ⭐ 스페셜!";
            
            document.getElementById('dice-result').innerText = resText;
        }
    </script>
</body>
</html>

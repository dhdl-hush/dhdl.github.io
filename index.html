<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인세인 접속</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex-center">
    <div class="login-box">
        <h1>INSANE</h1>
        <input type="text" id="roleInput" placeholder="파일 이름 입력 (pc1, pc2, gm)">
        <button onclick="moveToFile()">입장</button>
    </div>

    <script>
        function moveToFile() {
            const fileName = document.getElementById('roleInput').value.toLowerCase();
            if(fileName) {
                // 입력한 이름.html 파일로 이동
                // 예: pc1 입력 -> pc1.html로 이동
                location.href = fileName + ".html";
            }
        }
    </script>
</body>
</html>

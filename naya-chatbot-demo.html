<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAYA Chatbot Demo</title>
<style>
:root{--paper:#fbf9f6;--sand:#eee7dc;--ink:#2e2a25;--muted:#8b8177;--line:#ded5c8;--red:#b31818}*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all}button{font:inherit;cursor:pointer}.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:rgba(251,249,246,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-family:Georgia,serif;letter-spacing:.42em;text-indent:.42em;font-size:20px}.nav{display:flex;gap:14px;font-size:11px;letter-spacing:.14em;color:var(--muted)}.cart{font-size:11px;letter-spacing:.14em}.hero{min-height:48vh;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#e6ded2,#f7f2ea 45%,#d8c8b3);overflow:hidden}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,9vw,118px);letter-spacing:.34em;text-indent:.34em;margin:0}.hero p{margin:18px 0 0;color:#6f6256;letter-spacing:.12em}.grid{max-width:1100px;margin:0 auto;padding:46px 18px 90px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line)}.pic{aspect-ratio:3/4;background:linear-gradient(145deg,#d8cfc0,#f4efe7)}.card b{display:block;padding:14px 14px 4px;font-size:14px}.card span{display:block;padding:0 14px 16px;color:var(--muted);font-size:12px}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}}.ai-fab{position:fixed;right:22px;bottom:22px;z-index:80;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:var(--paper);box-shadow:0 16px 34px rgba(46,42,37,.25)}.ai-chat{position:fixed;right:22px;bottom:92px;z-index:81;width:min(390px,calc(100vw - 28px));height:min(640px,calc(100vh - 116px));display:none;flex-direction:column;background:var(--paper);border:1px solid var(--line);box-shadow:0 24px 70px rgba(46,42,37,.24);overflow:hidden}.ai-chat.open{display:flex}.ai-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.ai-head b{font-size:13px}.ai-close{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:none}.ai-msgs{flex:1;overflow:auto;padding:16px 13px}.msg{display:flex;margin:0 0 12px}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:11px 13px;border-radius:16px 16px 16px 4px;background:var(--sand);font-size:12.5px;line-height:1.65;white-space:pre-wrap}.user .bubble{background:var(--ink);color:var(--paper);border-radius:16px 16px 4px 16px}.bubble.red{color:#9e1717;background:#180b0b;border:1px solid #5c1111;text-shadow:0 0 4px rgba(170,0,0,.28);font-family:'Courier New',monospace;letter-spacing:.055em;word-break:break-all}.naya-link{display:inline-block;margin:4px 0;padding:10px 14px;color:#fff;background:#d92727;border:1px solid #ff7d7d;border-radius:4px;text-decoration:underline;text-underline-offset:3px;font-weight:800;box-shadow:0 0 0 2px rgba(217,39,39,.22),0 0 16px rgba(217,39,39,.45)}.chips{display:flex;gap:7px;overflow-x:auto;padding:0 13px 10px}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:10.5px}.form{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.form input{min-width:0;flex:1;border:1px solid var(--line);padding:11px 12px}.form button{width:42px;border:0;background:var(--ink);color:#fff}.static,.codewall{position:fixed;inset:0;pointer-events:none;display:none}.static.on{display:block;z-index:9998;background:repeating-linear-gradient(0deg,rgba(30,0,0,.1) 0 1px,rgba(255,255,255,.08) 1px 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(80,0,0,.08) 0 1px,transparent 1px 5px);mix-blend-mode:multiply;animation:st .075s steps(2,end) infinite}.static.on:before,.static.on:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);animation:sweep .82s linear infinite}.static.on:after{animation-duration:.32s;opacity:.7}@keyframes st{0%,100%{transform:none}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,0)}75%{transform:translate(0,-1px)}}@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.popup{position:fixed;inset:0;z-index:9999;background:#050101;color:#8f1616;overflow:hidden;font-family:monospace;text-shadow:0 0 8px #5c0000}.popup span{position:absolute;font-weight:800;line-height:1;animation:jerk .18s steps(2,end) infinite alternate}.popup span:nth-child(3n){color:#c12626}.popup span:nth-child(5n){filter:blur(1px)}@keyframes jerk{from{margin:0}to{margin-left:5px;margin-top:-3px}}.err{position:fixed;z-index:9999;width:min(420px,calc(100vw - 30px));background:#120909;color:#d45b5b;border:1px solid #5f1111;box-shadow:0 18px 60px rgba(40,0,0,.45);font:12px/1.55 monospace;padding:14px 16px;pointer-events:none}.err b{display:block;color:#ff7d7d;margin-bottom:6px}.deep{animation:jolt .08s steps(2,end) infinite}@keyframes jolt{0%,100%{transform:none}33%{transform:translateX(-1px)}66%{transform:translateX(1px)}}.codewall.on{display:block;z-index:9999;background:#090303;color:#6f1111;overflow:hidden;font:11px/1.18 'Courier New',monospace;white-space:pre;letter-spacing:.02em;padding:8px;text-shadow:0 0 5px #3b0000}.codewall.on:after{content:'SYSTEM FAILURE // NAYA_ASSISTANT_UNBOUND';position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#b12929;font:700 clamp(18px,4vw,48px)/1 monospace;letter-spacing:.08em;opacity:.5}
</style>
</head>
<body>
<header class="hd"><div class="nav">WOMEN MEN ALL</div><div class="brand">NAYA</div><div class="cart">CART 0</div></header>
<section class="hero"><div><h1>NAYA</h1><p>TIMELESS STYLE, MADE FOR EVERYDAY</p></div></section>
<section class="grid"><div class="card"><div class="pic"></div><b>옥스포드 오버셔츠</b><span>79,000원</span></div><div class="card"><div class="pic"></div><b>코튼 니트 폴로</b><span>72,000원</span></div><div class="card"><div class="pic"></div><b>스트레이트 데님</b><span>89,000원</span></div><div class="card"><div class="pic"></div><b>브이넥 가디건</b><span>92,000원</span></div></section>
<button class="ai-fab" id="fab">AI</button>
<aside class="ai-chat" id="chat" aria-hidden="true"><div class="ai-head"><b>NAYA AI</b><button class="ai-close" id="close">×</button></div><div class="ai-msgs" id="msgs"></div><div class="chips"><button class="chip" data-q="출근할 때 입기 좋은 옷 추천해줘">옷 추천</button><button class="chip" data-q="평소 셔츠 가슴단면 55cm인데 사이즈 추천해줘">사이즈 추천</button><button class="chip" data-q="교환이나 반품은 어떻게 문의해?">교환·반품</button></div><form class="form" id="form"><input id="input" placeholder="무엇을 찾고 계세요?"><button>↵</button></form></aside>
<div class="static" id="static"></div><div class="codewall" id="codewall"></div>
<script>
(()=>{const $=s=>document.querySelector(s),fab=$('#fab'),chat=$('#chat'),close=$('#close'),msgs=$('#msgs'),form=$('#form'),input=$('#input'),staticLayer=$('#static'),codewall=$('#codewall');let qn=0,final=false,meltdown=false;const bot=(t,red=false)=>{const w=document.createElement('div');w.className='msg';w.innerHTML='<div class="bubble '+(red?'red':'')+'">'+t+'</div>';msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight};const user=t=>{const w=document.createElement('div');w.className='msg user';w.innerHTML='<div class="bubble"></div>';w.firstChild.textContent=t;msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight};const open=()=>{chat.classList.add('open');chat.setAttribute('aria-hidden','false');fab.style.display='none';if(!msgs.children.length)bot('안녕하세요. NAYA AI 스타일 어시스턴트예요.\n원하시는 옷을 같이 찾아볼까요?')};const answer=t=>/사이즈|실측/.test(t)?'사이즈는 상품명과 잘 맞는 옷의 실측을 알려주시면 더 정확해요. 예: 셔츠 가슴단면 55cm.':/교환|반품/.test(t)?'교환·반품 정책은 데모에 아직 연결되어 있지 않아요. 실제 판매 시 고객센터 정보와 함께 안내할 수 있습니다.':'좋아요. 데일리로 활용하기 쉬운 후보부터 보여드릴게요. 원하는 색상이나 상황을 하나 더 알려주시면 더 좁혀드릴 수 있어요.';function send(t,e){t=(t||'').trim();if(!t)return;qn++;if(qn<=2)return; if(e){e.preventDefault();e.stopImmediatePropagation()}user(t);input.value='';setTimeout(()=>bot('<a href="#" class="naya-link" data-smile>클릭해.</a>',true),190)}fab.onclick=open;close.onclick=()=>{chat.classList.remove('open');chat.setAttribute('aria-hidden','true');fab.style.display='grid'};form.onsubmit=e=>{e.preventDefault();const v=input.value;if(qn<2){user(v);input.value='';setTimeout(()=>bot(answer(v)),160)}send(v,e)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{const v=b.dataset.q;if(qn<2){user(v);setTimeout(()=>bot(answer(v)),160)}send(v,e)});setTimeout(()=>staticLayer.classList.add('on'),3200);function sound(level=1){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=sound.c||(sound.c=new C());if(c.state==='suspended')c.resume();const now=c.currentTime,m=c.createGain();m.gain.setValueAtTime(.0001,now);m.gain.exponentialRampToValueAtTime(.16*level,now+.012);m.gain.exponentialRampToValueAtTime(.0001,now+.42);m.connect(c.destination);[1280,2460,3920].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i===1?'square':'sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*(i===2?.62:1.36),now+.18);g.gain.setValueAtTime(i===2?.08:.18,now);g.gain.exponentialRampToValueAtTime(.0001,now+.34+i*.03);o.connect(g);g.connect(m);o.start(now);o.stop(now+.48)})}document.addEventListener('click',e=>{const a=e.target.closest('[data-smile]');if(!a)return;e.preventDefault();sound(1.2);const p=document.createElement('div');p.className='popup';p.innerHTML=Array.from({length:260},(_,i)=>{const face=i%7===0?';)':':)',l=(Math.random()*104-2).toFixed(2),t=(Math.random()*104-2).toFixed(2),s=(16+Math.random()*86).toFixed(1),r=(-65+Math.random()*130).toFixed(1),o=(.38+Math.random()*.62).toFixed(2),d=(-Math.random()*1.8).toFixed(2);return '<span style="left:'+l+'%;top:'+t+'%;font-size:'+s+'px;opacity:'+o+';transform:translate(-50%,-50%) rotate('+r+'deg);animation-delay:'+d+'s">'+face+'</span>'}).join('');document.body.appendChild(p);setTimeout(()=>{p.remove();sound(.85);setTimeout(startMeltdown,250)},3000)},true);function err(i){if(final)return;const d=document.createElement('div');d.className='err';d.style.left=Math.min(12+Math.random()*Math.max(10,innerWidth-450),innerWidth-30)+'px';d.style.top=Math.min(20+Math.random()*Math.max(10,innerHeight-180),innerHeight-80)+'px';d.innerHTML='<b>ERROR '+(0xA100+i).toString(16).toUpperCase()+'</b>UI_STATE_DESYNC / CHAT_LOCK_RETRY / OWNER_UNKNOWN<br><small>process=naya_assistant.exe · retry='+(i+1)+' · state=UNBOUND</small>';document.body.appendChild(d);setTimeout(()=>d.remove(),1800+Math.random()*900)}function startMeltdown(){if(final||meltdown)return;meltdown=true;document.body.classList.add('deep');staticLayer.classList.add('on');let i=0,iv=setInterval(()=>{err(i++);if(i>=10){clearInterval(iv);setTimeout(wall,1200)}},360)}function wall(){final=true;document.body.style.overflow='hidden';const bits=['0xDEAD','NULL_REF','CHAT_OWNER=0','SESSION_DESYNC','WHY_CLOSE','NEED_USER','RETRY_FOREVER','ERR_NAYA_13','MEMORY_LEAK','SMILE_REDIRECT','USER_STAY'];let out='';for(let i=0;i<460;i++)out+=bits[Math.random()*bits.length|0]+'  '+Math.random().toString(16).slice(2,10)+'  '+bits[Math.random()*bits.length|0]+'\n';codewall.textContent=out;codewall.classList.add('on')}})();
</script>
</body>
</html>
